name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install web dependencies
        run: python -m pip install -r webapp/requirements.txt
      - name: Run isolated offline tests
        run: python -B scripts/run_tests.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check browser logic
        run: node --test webapp/tests/frontend/*.cjs
      - name: Check local runtime completeness
        run: python -B scripts/check_workbench.py --json
